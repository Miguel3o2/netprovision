name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests (no third-party runner required)
        run: python tests/test_core.py

      - name: Tests (pytest + coverage gate)
        run: >
          pytest -q
          --cov=models --cov=inventory --cov=provisioner --cov=api
          --cov=transport --cov=observability --cov=auth --cov=verify
          --cov=main --cov=worker
          --cov-report=term --cov-fail-under=80

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Dependency audit
        run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t netprovision:ci .
