[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".venv", "build", "dist", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]          # assert False is fine in tests
"api/server.py" = ["B008"]    # FastAPI dependencies are declared as argument defaults

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
files = [
    "main.py",
    "worker.py",
    "models.py",
    "transport.py",
    "observability.py",
    "auth.py",
    "verify.py",
    "api",
    "inventory",
    "provisioner",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
